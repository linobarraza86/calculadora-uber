<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Uber - Viabilidad de Viaje</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #111;
            color: #f1f1f1;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00c851;
            border: none;
            color: white;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #009e3e;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background: #333;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Calculadora Uber</h1>

    <div class="container">
        <h3>Datos del vehículo</h3>
        <label>Rendimiento (km por litro):</label>
        <input type="number" id="rendimiento" step="0.1">

        <label>Precio gasolina por litro:</label>
        <input type="number" id="precio_gasolina" step="0.1">

        <label>Desgaste del vehículo por km (recomendado: 1.2):</label>
        <input type="number" id="desgaste" step="0.1" value="1.2">

        <h3>Datos del viaje</h3>
        <label>Distancia del viaje (km):</label>
        <input type="number" id="km" step="0.1">

        <label>Pago del viaje:</label>
        <input type="number" id="pago" step="0.1">

        <button onclick="calcular()">Calcular Viabilidad</button>

        <div id="resultado"></div>
    </div>

    <script>
        function calcular() {
            let rendimiento = parseFloat(document.getElementById("rendimiento").value);
            let precioGasolina = parseFloat(document.getElementById("precio_gasolina").value);
            let desgaste = parseFloat(document.getElementById("desgaste").value);
            let km = parseFloat(document.getElementById("km").value);
            let pago = parseFloat(document.getElementById("pago").value);

            // Cálculos
            let litros = km / rendimiento;
            let costoGasolina = litros * precioGasolina;
            let costoDesgaste = km * desgaste;
            let ganancia = pago - (costoGasolina + costoDesgaste);
            let ingresoPorKm = pago / km;

            // REGLA NUEVA: mínimo $7 pesos por km
            let esViable = ingresoPorKm >= 7;

            document.getElementById("resultado").innerHTML = `
                <p>Litros usados: ${litros.toFixed(2)} L</p>
                <p>Costo gasolina: $${costoGasolina.toFixed(2)}</p>
                <p>Costo desgaste: $${costoDesgaste.toFixed(2)}</p>
                <p><strong>Ganancia estimada: $${ganancia.toFixed(2)}</strong></p>
                <p>Ingreso por km: <strong>$${ingresoPorKm.toFixed(2)}</strong></p>
                <p style="color:${esViable ? 'lime' : 'red'}; font-weight:bold; font-size:20px;">
                    Viaje ${esViable ? 'VIABLE ✔️' : 'NO VIABLE ❌'}
                </p>
            `;
        }
    </script>

    <script src="sw.js"></script>

</body>
</html>
