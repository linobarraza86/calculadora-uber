<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Uber</title>
<link rel="manifest" href="manifest.json">
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        transition: 0.3s;
    }
    :root {
        --bg: #f1f1f1;
        --text: #000;
        --card: #fff;
        --button: #007bff;
        --button-text: #fff;
    }
    .dark {
        --bg: #121212;
        --text: #ffffff;
        --card: #1e1e1e;
        --button: #00a2ff;
        --button-text: #000;
    }
    .container {
        background: var(--card);
        padding: 20px;
        border-radius: 14px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        max-width: 450px;
        margin: auto;
    }
    h2 { text-align: center; margin-bottom: 20px; }
    label { font-weight: bold; }
    input, select {
        width: 100%;
        padding: 12px;
        margin: 8px 0 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        background: var(--card);
        color: var(--text);
    }
    button {
        width: 100%;
        padding: 15px;
        background: var(--button);
        color: var(--button-text);
        border: none;
        border-radius: 10px;
        font-size: 18px;
        margin-top: 10px;
    }
    .resultado {
        margin-top: 20px;
        padding: 15px;
        background: var(--card);
        border-radius: 10px;
    }
    .toggle {
        cursor: pointer;
        font-size: 14px;
        text-align: center;
        margin-bottom: 10px;
        color: #00a2ff;
    }
</style>
</head>
<body>

<div class="toggle" onclick="toggleTheme()">🌙 Cambiar modo</div>

<div class="container">
    <h2>Calculadora Uber</h2>

    <label>Rendimiento (km/L):</label>
    <input type="number" id="rendimiento" step="0.1">

    <label>Precio del combustible:</label>
    <input type="number" id="precio" step="0.1">

    <label>Distancia del viaje (km):</label>
    <input type="number" id="distancia" step="0.1">

    <label>Pago ($):</label>
    <input type="number" id="pago" step="0.1">

    <label>Comisión de Uber (%):</label>
    <input type="number" id="comision" step="1" value="25">

    <label>Desgaste del vehículo ($/km):</label>
    <input type="number" id="desgaste" step="0.1" value="0.80">

    <button onclick="calcular()">Calcular Viabilidad</button>
    <button onclick="calcularCobro()">¿Cuánto debo cobrar?</button>

    <div class="resultado" id="resultado"></div>
</div>

<script>
// ---------- MODO OSCURO ----------
function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}
if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");

// ---------- GUARDAR DATOS DEL VEHÍCULO ----------
window.onload = () => {
    if (localStorage.getItem("rendimiento")) {
        document.getElementById("rendimiento").value = localStorage.getItem("rendimiento");
        document.getElementById("precio").value = localStorage.getItem("precio");
    }
};

function saveVehicleData() {
    localStorage.setItem("rendimiento", document.getElementById("rendimiento").value);
    localStorage.setItem("precio", document.getElementById("precio").value);
}

// ---------- CALCULAR VIABILIDAD ----------
function calcular() {
    saveVehicleData();

    let r = parseFloat(document.getElementById("rendimiento").value);
    let precio = parseFloat(document.getElementById("precio").value);
    let km = parseFloat(document.getElementById("distancia").value);
    let pago = parseFloat(document.getElementById("pago").value);
    let comision = parseFloat(document.getElementById("comision").value);
    let desgaste = parseFloat(document.getElementById("desgaste").value);

    let litros = km / r;
    let costoGas = litros * precio;
    let costoDesgaste = km * desgaste;
    let uber = pago * (comision / 100);
    let pagoFinal = pago - uber;

    let ganancia = pagoFinal - costoGas - costoDesgaste;

    document.getElementById("resultado").innerHTML = `
        <b>Litros:</b> ${litros.toFixed(2)} L<br>
        <b>Costo gasolina:</b> $${costoGas.toFixed(2)}<br>
        <b>Desgaste:</b> $${costoDesgaste.toFixed(2)}<br>
        <b>Comisión Uber:</b> -$${uber.toFixed(2)}<br>
        <b>Te quedan:</b> $${pagoFinal.toFixed(2)}<br><br>
        <b>Ganancia final:</b> $${ganancia.toFixed(2)}<br><br>
        ${ganancia > 0 
            ? "<b style='color:lightgreen;'>✔ Viaje viable</b>" 
            : "<b style='color:red;'>❌ No conviene</b>"
        }
    `;
}

// ---------- ¿CUÁNTO DEBO COBRAR? ----------
function calcularCobro() {
    let r = parseFloat(document.getElementById("rendimiento").value);
    let precio = parseFloat(document.getElementById("precio").value);
    let km = parseFloat(document.getElementById("distancia").value);
    let comision = parseFloat(document.getElementById("comision").value);
    let desgaste = parseFloat(document.getElementById("desgaste").value);

    let litros = km / r;
    let costoGas = litros * precio;
    let costoDesgaste = km * desgaste;

    let costos = costoGas + costoDesgaste;

    let cobroNecesario = costos / (1 - comision / 100);

    document.getElementById("resultado").innerHTML = `
        <b>Costo total del viaje:</b> $${costos.toFixed(2)}<br>
        <b>Uber descuenta:</b> ${comision}%<br><br>
        <b>Debes cobrar mínimo:</b> <span style="color:yellow;font-size:22px;">$${cobroNecesario.toFixed(2)}</span>
    `;
}
</script>

<script>
// ---------- PWA SERVICE WORKER ----------
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
